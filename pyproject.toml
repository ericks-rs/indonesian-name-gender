[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "indonamegender"
version = "1.0.1"
description = "Character-level gender classification for Indonesian personal names"
readme = "README_pypi.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Ericks Rachmat Swedia", email = "ericks_rs@staff.gunadarma.ac.id"}]
keywords = ["nlp", "indonesian", "name-classification", "character-level"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: Indonesian",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=1.12", "numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/ericks-rs/indonesian-name-gender"
Repository = "https://github.com/ericks-rs/indonesian-name-gender"
Issues = "https://github.com/ericks-rs/indonesian-name-gender/issues"

[project.optional-dependencies]
analysis = ["pandas>=1.3", "scikit-learn>=1.0", "scipy>=1.7", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
indonamegender = ["data/*.pkl", "data/*.pt"]
